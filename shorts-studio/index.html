  .video-cell { gap:12px; }

  .detail-grid { padding:20px 16px; }
  .side { width:180px; }
  .groups { gap:4px; }
  .group-head { display:block; }
}
</style>

function renderList(jobs) {
  if (!jobs.length) return header()+'<main class="page"><div class="list-heading"><h1>콘텐츠</h1><span class="count">0개</span></div><div class="empty"><div><strong>아직 만든 영상이 없습니다</strong>위에 주제를 넣고 첫 영상을 만들어 보세요.</div></div></main>';
  jobs.sort(function(a,b){return a.status==="running"?-1:b.status==="running"?1:new Date(b.createdAt)-new Date(a.createdAt);});
  const rows=jobs.map(function(job){
    const status=statusInfo(job), review=reviewInfo(job), progress=progressCount(job);
    const bar=job.status==="running"?'<div class="track" aria-label="10단계 중 '+progress+'단계"><span style="width:'+(progress*10)+'%"></span></div><div class="cell-sub">'+progress+'/10</div>':'';
    return '<tr class="job-row" tabindex="0" data-id="'+esc(job.id)+'"><td><div class="video-cell">'+cover(job,"cover")+'<div class="video-copy"><div class="video-title">'+esc(titleOf(job))+'</div><div class="topic">'+esc(job.topic)+'</div><div class="mobile-meta"><span class="status '+status.cls+'">'+esc(status.label)+'</span> · '+esc(fmtDate(job.createdAt))+'</div></div></div></td><td><div class="status '+status.cls+'">'+esc(status.label)+'</div>'+bar+'</td><td><span class="review '+review.cls+'">'+esc(review.label)+'</span></td><td class="number">'+esc(fmtDate(job.createdAt))+'</td><td class="number">'+esc(fmtDuration(totalMs(job)))+'</td></tr>';
  }).join("");
  return header()+'<main class="page"><div class="list-heading"><h1>콘텐츠</h1><span class="count">'+jobs.length+'개</span></div><table class="jobs"><colgroup><col><col><col><col><col></colgroup><thead><tr><th>영상</th><th>상태</th><th>검수</th><th>날짜</th><th>걸린 시간</th></tr></thead><tbody>'+rows+'</tbody></table></main>';
}
function groupBars(job) {
  return '<div class="groups" aria-label="제작 진행">'+STAGE_GROUPS.map(function(group){
    const ss=group.stages.map(function(name){return job.stages.find(function(s){return s.name===name;});});
    const reached=ss.filter(function(s){return s.status==="done"||s.status==="running"||s.status==="failed";}).length;
    const failed=ss.some(function(s){return s.status==="failed";});
    return '<div class="group '+(failed?'failed':'')+'"><div class="group-head"><span>'+group.name+'</span><span>'+reached+'/'+ss.length+'</span></div><div class="group-track"><span style="width:'+(reached/ss.length*100)+'%"></span></div></div>';
  }).join("")+'</div>';
}
function facts(job) { return '<dl class="facts"><div><dt>걸린 시간</dt><dd>'+esc(fmtDuration(totalMs(job)))+'</dd></div><div><dt>실행 AI</dt><dd>'+esc(fmtRunner(job.runner))+'</dd></div><div><dt>만든 날짜</dt><dd>'+esc(fmtDate(job.createdAt))+'</dd></div></dl>'; }
function preview(job) {
  if (job.status === "running") return '<aside class="side"><div class="preview">'+cover(job,"preview-image")+'<div class="preview-note">만드는 중</div></div>'+facts(job)+'</aside>';
  if (!job.hasVideo) return '<aside class="side"><div class="preview"><div class="preview-note">영상 없음</div></div>'+facts(job)+'</aside>';
  return '<aside class="side"><div class="preview">'+cover(job,"preview-image")+'</div>'+facts(job)+'</aside>';
}
function runningLog(job) {
  let elapsed=0; return job.stages.filter(function(s){return s.status==="done"||s.status==="running";}).map(function(s){
    const start=elapsed; if(s.status==="done") elapsed+=s.durationMs||0;
    const stamp=fmtDuration(start).replace("–","0초");
    return '['+stamp+'] '+STAGE_NAMES[s.name]+' '+(s.status==="done"?'완료 · '+fmtDuration(s.durationMs):'진행 중 · '+fmtDuration(s.durationMs)+' 경과');
  }).join('\n');
}
function remainingMs(job,current) {
  const averages={"script":29614,"audio":155970,"timing":15018,"render":79900,"qa":38165,"package":19011};
  const left=Math.max(0,(averages[current.name]||0)-current.durationMs);
  const index=job.stages.indexOf(current);
  return left+job.stages.slice(index+1).reduce(function(sum,s){return sum+(averages[s.name]||0);},0);
}
function renderRunning(job) {
  const current=job.stages.find(function(s){return s.status==="running";}), count=progressCount(job), remaining=remainingMs(job,current);
  return '<div class="progress-line">편집 · '+esc(STAGE_NAMES[current.name])+' ('+count+'/10) <span>· 경과 '+esc(fmtDuration(totalMs(job)))+' · 남은 시간 약 '+Math.max(1,Math.round(remaining/60000))+'분</span></div>'+groupBars(job)+'<section class="log-box"><div class="log-head">실시간 로그</div><pre class="log">'+esc(runningLog(job))+'</pre></section>';
}
function record(job) {
  return '<details><summary>제작 기록</summary><div class="record">'+STAGE_GROUPS.map(function(group){return '<section><h3>'+group.name+'</h3>'+group.stages.map(function(name){const s=job.stages.find(function(x){return x.name===name;});return '<div class="record-row"><span>'+STAGE_NAMES[name]+'</span><span>'+fmtDuration(s.durationMs)+'</span></div>';}).join('')+'</section>';}).join('')+'</div></details>';
}
function renderDone(job) {
  const count=job.qa.errors.length+job.qa.warns.length, pass=job.qa.pass;
  const issues='<ul class="issues error">'+job.qa.errors.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul><ul class="issues warning">'+job.qa.warns.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';
  const action=job.upload?'<a class="primary secondary" href="'+esc(job.upload.studioUrl)+'" target="_blank" rel="noopener">Studio에서 열기</a>':'<button class="primary" type="button">올리기 (비공개)</button><button type="button">다시 만들기</button>';
  return (job.upload?'<div class="detail-state">업로드됨</div>':'')+'<section class="section"><h2>검수 결과</h2><div class="review-title '+(pass?'pass':'warn')+'">'+(pass?'통과':'지적 '+count+'건')+'</div>'+issues+'<div class="actions">'+action+'</div></section><section class="section"><h2>영상 정보</h2><div class="field"><div class="field-label">제목</div><div class="field-value">'+esc(job.meta.title)+'</div></div><div class="field"><div class="field-label">설명</div><div class="field-value">'+esc(job.meta.description)+'</div></div><div class="field"><div class="field-label">해시태그</div><div class="field-value hashtags">'+esc(job.meta.hashtags.join(' '))+'</div></div></section>'+record(job);
}
function renderFailed(job) {
  const failed=job.stages.find(function(s){return s.status==="failed";});
  const last=job.stages.filter(function(s){return s.status==="done"||s.status==="failed";}).map(function(s){return STAGE_NAMES[s.name]+' '+(s.status==="failed"?'실패':'완료')+' · '+fmtDuration(s.durationMs);}).join('\n');
  return '<div class="error-line">'+esc(STAGE_NAMES[failed.name])+' 단계에서 멈췄습니다 · '+esc(job.error)+'</div><div class="actions" style="margin:0 0 24px"><button class="primary" type="button">실패한 단계부터 다시</button></div>'+groupBars(job)+'<section class="log-box"><div class="log-head">마지막 로그</div><pre class="log">'+esc(last)+'</pre></section>';
}
function renderDetail(job) {
  const main=job.status==="running"?renderRunning(job):job.status==="failed"?renderFailed(job):renderDone(job);
  return '<header class="detail-head"><a class="back" href="#list">← 목록</a><h1>'+esc(titleOf(job))+'</h1></header><main class="detail-grid"><section class="detail-main">'+main+'</section>'+preview(job)+'</main>';
}
function bind() {
  document.querySelectorAll('.job-row').forEach(function(row){
    function open(){location.hash='#job/'+encodeURIComponent(row.dataset.id);}
    row.addEventListener('click',open); row.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});
  });
}
function render() { const model=routeModel(); $('#app').innerHTML=model.screen==='list'?renderList(model.jobs):renderDetail(model.job); bind(); }
const theme=new URLSearchParams(location.search).get('theme'); if(theme==='light'||theme==='dark') document.documentElement.dataset.theme=theme;
window.addEventListener('hashchange',render); render();
</script>
</body>
</html>
